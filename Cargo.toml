[package]
name = "solo-miner"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
bitcoin = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", features = ["compress"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
